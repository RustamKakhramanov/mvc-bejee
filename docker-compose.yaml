version: "3.7"
services:
  nginx:
    container_name: bejee_nginx
    image: nginx
    ports:
      - ${APP_PORT:-8083}:80
    volumes:
      - ./.docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.docker-compose/nignx/logs:/var/log/nginx
      - .:/var/www/html
  php:
    container_name: bejee_php
    build: ./.docker-compose/php
    volumes:
      - .:/var/www/html
      - ./.docker-compose/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    restart: always
    tty: true

  postgres:
    container_name: bejee_postgres
    image: postgres:12.4
    volumes:
      - "./.docker-compose/postgres/data:/var/lib/postgresql/data"
      - ./postgres/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${FORWARD_DB_PORT:-5430}:5432
    restart: always
